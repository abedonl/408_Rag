[project]
name = "cs408rag"
version = "0.1.0"
description = "面向考研 408 的真题检索问答与考点分析系统"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- 服务 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "loguru>=0.7",
    # --- 检索与存储 ---
    "qdrant-client>=1.20",
    "neo4j>=5.20",
    # --- 模型 ---
    "FlagEmbedding>=1.3",
    "torch>=2.4",
    # --- 数据处理 ---
    "pymupdf>=1.24",
    "jieba>=0.42",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.32",
    # --- LLM ---
    "openai>=1.40",
    # --- Agent（二期）---
    "langgraph>=1.2",
    # --- Demo ---
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs408rag"]

# torch 默认走 PyPI（Windows 上是 CPU wheel，约 200MB，装得快）。
#
# 为什么默认 CPU：这是可分享项目该有的默认值 —— 克隆仓库的人未必有 N 卡，
# 而整条链路（数据管道、图谱、检索、评测）在 CPU 上都能跑通。
#
# RTX 40 系用户想要 GPU 加速（重排阶段提速最明显），执行：
#     bash scripts/install_cuda_torch.sh
# 该脚本从 download.pytorch.org 拉 cu124 wheel 并覆盖安装。
# 实测：官方源 4.2MB/s，国内镜像（阿里云 0.56MB/s、上交）反而更慢，
#      而 uv 直连官方源的下载+解压吞吐只有 ~0.5MB/s，所以脚本用 curl 预下载。
#
# 注意：build/embedder 与 reranker 都会探测 torch.cuda.is_available()，
#      装的是 CPU 版时会打 warning 并自动回退，不会报错。

# 网络受限：GitHub 只通 codeload/api，HuggingFace 只通镜像。
# 模型下载统一走 hf-mirror（见 src/cs408rag/config.py 与 .env.example）
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults