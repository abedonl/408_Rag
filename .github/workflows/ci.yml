name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只装纯函数测试需要的依赖；不装 torch / FlagEmbedding / qdrant，
      # 避免 CI 拉数 GB 依赖。真实数据与模型不进公开仓库。
      - name: Install minimal deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q pytest ruff loguru pydantic pydantic-settings openai

      - name: Lint
        run: ruff check src app tests

      - name: Unit tests (no data/model)
        env:
          PYTHONPATH: src
        run: pytest tests/test_adversarial_unit.py -q